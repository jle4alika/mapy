apiVersion: 1

providers:
  - name: Core
    orgId: 1
    folder: Observability
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/core
      foldersFromFilesStructure: false

  # Дашборд Celery всегда в UI; метрики появятся при COMPOSE_PROFILES=celery
  - name: Celery
    orgId: 1
    folder: Observability
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/celery
      foldersFromFilesStructure: false
